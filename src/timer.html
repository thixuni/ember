<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Everyday Orbit timer</title>
<style>
/* The same greys as the planner, which clear WCAG AA; this window has its
   own stylesheet and did not get them when the planner's were raised. */
:root{
  --surface:#FFFFFF; --surface-2:#FAFAFB; --line:#E6E6E9; --line-2:#D6D6DA;
  --ink:#232428; --ink-2:#3E3F44; --muted:#54555B; --faint:#606167;
  --accent:#3F7D5C; --danger:#C25340; --danger-soft:#FAE8E4; --danger-ink:#7A4133;
  --on-accent:#FFFFFF; --tint-base:#FFFFFF;
  --ff:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fd:"Gabarito","Plus Jakarta Sans",system-ui,sans-serif;
  --c:#3F7D5C;
}
/* The planner sends the theme it resolved to, which lands as data-theme below.
   The media query is only what shows before that first message arrives. */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --surface:#28282B; --surface-2:#323236; --line:#39393E; --line-2:#4C4C52;
    --ink:#EDEDEF; --ink-2:#D2D2D6; --muted:#B6B6BB; --faint:#A4A4AA;
    --accent:#5FA37C; --danger:#E58270; --danger-soft:#3A2724; --danger-ink:#E58270;
    --on-accent:#0E1113; --tint-base:#28282B;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface:#28282B; --surface-2:#323236; --line:#39393E; --line-2:#4C4C52;
  --ink:#EDEDEF; --ink-2:#D2D2D6; --muted:#B6B6BB; --faint:#A4A4AA;
  --accent:#5FA37C; --danger:#E58270; --danger-soft:#3A2724; --danger-ink:#E58270;
  --on-accent:#0E1113; --tint-base:#28282B;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--ff);color:var(--ink);background:transparent;
  -webkit-font-smoothing:antialiased;overflow:hidden;user-select:none;cursor:default}

.tower{height:100%;display:flex;flex-direction:column;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;overflow:hidden;
  box-shadow:0 18px 44px -18px rgba(0,0,0,.45)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .tower{box-shadow:0 18px 44px -16px rgba(0,0,0,.72)}
}
:root[data-theme="dark"] .tower{box-shadow:0 18px 44px -16px rgba(0,0,0,.72)}

/* The whole strip is the drag handle; the controls opt out below. */
.grip{-webkit-app-region:drag;display:flex;align-items:center;gap:7px;padding:8px 9px 5px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:11.5px;font-weight:600;color:var(--ink-2)}
.close{-webkit-app-region:no-drag;width:18px;height:18px;border:0;background:none;cursor:pointer;
  border-radius:5px;color:var(--faint);display:grid;place-items:center;padding:0;flex:none}
.close:hover{background:var(--surface-2);color:var(--ink)}

.clock{-webkit-app-region:drag;text-align:center;font-family:var(--fd);font-size:34px;font-weight:600;
  letter-spacing:-.02em;line-height:1;padding:2px 8px 4px;font-variant-numeric:tabular-nums}
.clock.over{color:var(--danger)}
.mode{-webkit-app-region:drag;text-align:center;font-size:9.5px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--faint);padding-bottom:6px}

.bar{height:3px;background:var(--surface-2);flex:none}
.bar i{display:block;height:100%;background:var(--c);width:0}
.bar.over i{background:var(--danger)}

.row{-webkit-app-region:no-drag;display:flex;gap:5px;padding:7px 8px 8px}
button.act{flex:1;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface);
  cursor:pointer;font:inherit;font-size:11.5px;font-weight:600;color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;gap:5px}
button.act:hover{background:var(--surface-2);border-color:var(--line-2)}
button.act.go{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.act.stop:hover{background:var(--danger-soft);border-color:var(--danger-soft);color:var(--danger-ink)}
svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.idle{flex:1;display:grid;place-items:center;text-align:center;padding:0 14px;color:var(--faint);font-size:11.5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="tower" id="tower">
  <div class="grip">
    <span class="dot" id="dot"></span>
    <span class="name" id="name">Nothing running</span>
    <button class="close" id="hide" title="Hide" aria-label="Hide the timer">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div id="live" hidden>
    <div class="clock" id="clock">0:00</div>
    <div class="mode" id="mode">of 45m</div>
    <div class="bar" id="bar"><i id="fill"></i></div>
    <div class="row">
      <button class="act go" id="toggle"><svg viewBox="0 0 24 24" id="ticon"><path d="M9 5.5v13M15 5.5v13"/></svg><span id="tlabel">Pause</span></button>
      <button class="act stop" id="stop"><svg viewBox="0 0 24 24"><rect x="6.2" y="6.2" width="11.6" height="11.6" rx="2"/></svg>Stop</button>
      <button class="act" id="open" title="Open the task">
        <svg viewBox="0 0 24 24"><path d="M14 4.4h5.6V10M19.2 4.8 12 12"/><path d="M18.4 14v5A1.6 1.6 0 0 1 16.8 20.6H5.4A1.6 1.6 0 0 1 3.8 19V7.6A1.6 1.6 0 0 1 5.4 6h5"/></svg>
      </button>
    </div>
  </div>
  <div class="idle" id="idle">Start a timer on a task and it will show up here.</div>
</div>

<script>
(function(){
  "use strict";
  var api = window.orbit || null;
  var el = function(id){ return document.getElementById(id); };
  var state = {state:"idle"};

  function fmt(s){
    s = Math.max(0, Math.round(s));
    var h = Math.floor(s/3600), m = Math.floor(s%3600/60), ss = s%60;
    var p = function(n){ return String(n).padStart(2,"0"); };
    return (h ? h+":"+p(m) : m) + ":" + p(ss);
  }

  function mins(s){
    var m = Math.round(s/60), h = Math.floor(m/60), mm = m%60;
    return (h ? h+"h" : "") + (h && mm ? " " : "") + (mm || !h ? mm+"m" : "");
  }

  function paint(){
    if(typeof state.dark === "boolean")
      document.documentElement.setAttribute("data-theme", state.dark ? "dark" : "light");
    if(state.accent)
      document.documentElement.style.setProperty("--accent", state.accent);
    var live = state.state === "running" || state.state === "paused";
    el("live").hidden = !live;
    el("idle").hidden = live;
    if(!live){
      el("name").textContent = "Nothing running";
      document.documentElement.style.setProperty("--c", "#3F7D5C");
      return;
    }
    document.documentElement.style.setProperty("--c", state.colour || "#3F7D5C");
    el("name").textContent = state.title || "Task";
    el("dot").style.background = state.colour || "#3F7D5C";

    var secs = state.secs || 0, est = state.est || 0;
    el("clock").textContent = fmt(secs);
    el("clock").classList.toggle("over", !!state.over);
    el("bar").classList.toggle("over", !!state.over);
    el("mode").textContent = state.state === "paused" ? "Paused"
      : est ? (state.over ? fmt(secs-est) + " over " + mins(est) : "of " + mins(est))
            : "No estimate";
    el("fill").style.width = est ? Math.min(100, secs/est*100).toFixed(1)+"%" : "0%";

    var run = state.state === "running";
    el("tlabel").textContent = run ? "Pause" : "Resume";
    el("toggle").classList.toggle("go", run);
    el("ticon").innerHTML = run ? '<path d="M9 5.5v13M15 5.5v13"/>' : '<path d="M7.5 5.4v13.2l10.6-6.6z"/>';
  }

  if(api && api.onTimerCmd){
    api.onTimerCmd(function(d){ state = d || {state:"idle"}; paint(); });
  }
  var send = function(cmd){ if(api && api.timer) api.timer({cmd:cmd}); };
  el("toggle").addEventListener("click", function(){ send("toggle"); });
  el("stop").addEventListener("click", function(){ send("stop"); });
  el("hide").addEventListener("click", function(){ send("hide"); });
  el("open").addEventListener("click", function(){ send("open"); });
  paint();
})();
</script>
</body>
</html>
