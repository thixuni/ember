name: Build installers

# Push a version tag (v1.1.0) to cut a release: each platform builds and
# uploads its installer plus the update metadata electron-updater reads, so
# installed copies can update themselves.
#
# Press "Run workflow" on the Actions tab instead to get installers as
# downloadable artifacts without publishing anything.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  test:
    name: Check the sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build the standalone file and run the checks
        run: npm run check
      - name: Keep the single-file build
        uses: actions/upload-artifact@v4
        with:
          name: ember-html
          path: dist/ember.html
          retention-days: 30

  build:
    name: Build for ${{ matrix.os }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # Code signing is optional. The certificate variables must be absent
      # rather than empty: electron-builder reads an empty CSC_LINK as a path
      # to a certificate file and fails with "not a file", so they are only
      # exported when the secrets actually exist.
      - name: Prepare code signing
        shell: bash
        env:
          SIGN_CERT: ${{ secrets.CSC_LINK }}
          SIGN_PASS: ${{ secrets.CSC_KEY_PASSWORD }}
          NOTARY_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASS: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          NOTARY_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$SIGN_CERT" ]; then
            echo "Signing with the certificate in CSC_LINK."
            echo "CSC_LINK=$SIGN_CERT"               >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$SIGN_PASS"       >> "$GITHUB_ENV"
            echo "CSC_IDENTITY_AUTO_DISCOVERY=true"  >> "$GITHUB_ENV"
          else
            echo "No certificate configured — building unsigned."
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          fi
          if [ -n "$NOTARY_ID" ]; then
            echo "APPLE_ID=$NOTARY_ID"                        >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$NOTARY_PASS"   >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$NOTARY_TEAM"                 >> "$GITHUB_ENV"
          fi

      # Signing in with Google needs the app's own Google client. It lives in
      # two repository secrets and is written out only here, at build time,
      # so it is never committed. Without them the app still builds, and
      # asks for a Client ID on first launch instead.
      - name: Google sign-in client
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -n "$GOOGLE_CLIENT_ID" ]; then
            node -e 'require("fs").writeFileSync("google-client.json", JSON.stringify({clientId: process.env.GOOGLE_CLIENT_ID, clientSecret: process.env.GOOGLE_CLIENT_SECRET}))'
            echo "Google sign-in client written."
          else
            echo "No Google client configured; the app will ask for one."
          fi

      - name: Build and publish
        run: npm run build -- --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep the installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          retention-days: 30
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.zip
            release/latest*.yml

  attach-html:
    name: Attach the single-file build
    needs: [test, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ember-html
          path: html
      - name: Add it to the release
        uses: softprops/action-gh-release@v2
        with:
          files: html/ember.html
